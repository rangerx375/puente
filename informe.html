<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex">
  <title>Puente Class Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E5C58'/%3E%3Cpath d='M12 40c6-16 12-24 20-24s14 8 20 24' stroke='%23F3EEE4' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
  <style>
    /* Teacher-only class report. Same palette and faces as the Puente app; one column, summary first, then every student. */
    :root {
      --paper: #F3EEE4; --card: #FFFBF5; --line: #D9D0BF; --ink: #1A1714; --soft: #4A433C; --muted: #7A7268;
      --teal: #0E5C58; --teal-soft: #D7E8E6; --terra: #B4502F; --terra-soft: #F3DDD6; --gold: #8A6A1F; --gold-soft: #F1E6CC;
      --track: #E6DDCC;
      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
      --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161413; --card: #1F1C1A; --line: #3A3430; --ink: #F1EBE1; --soft: #CFC6B9; --muted: #9C9388;
        --teal: #6FC2BB; --teal-soft: #1D3634; --terra: #E68A6C; --terra-soft: #3D2620; --gold: #D9B866; --gold-soft: #3A3120;
        --track: #2E2926; color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
    .wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      display: grid; gap: 28px; }
    h1, h2 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
    h1 { font-size: 2rem; line-height: 1.1; }
    h2 { font-size: 1.3rem; }
    .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
    .meta { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: .9rem; }
    button { font: inherit; cursor: pointer; }
    .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
    .btn:hover { border-color: var(--teal); }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    a { color: var(--teal); }

    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
    .tile b { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .tile span { color: var(--muted); font-size: .88rem; }
    @media (max-width: 700px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    section { display: grid; gap: 12px; }
    .attn { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .attn li { display: grid; grid-template-columns: 9.5rem 1fr; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
    .attn li:first-child { border-top: 0; }
    .attn .who { color: var(--soft); }
    @media (max-width: 560px) { .attn li { grid-template-columns: 1fr; gap: 4px; } }

    .pill { display: inline-block; font-size: .74rem; font-weight: 700; letter-spacing: .03em; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
    .p-ok { background: var(--teal-soft); color: var(--teal); }
    .p-warn { background: var(--gold-soft); color: var(--gold); }
    .p-bad { background: var(--terra-soft); color: var(--terra); }
    .p-dim { background: var(--track); color: var(--soft); }

    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
    .seg button { border: 0; background: none; color: var(--soft); padding: 6px 12px; font-size: .9rem; }
    .seg button[aria-pressed="true"] { background: var(--teal); color: var(--card); }

    .roster { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row { border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row > button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; gap: 4px 16px; padding: 12px 16px;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.7fr) 6.5rem 5rem 13rem; align-items: center; }
    .row > button:hover { background: color-mix(in srgb, var(--teal-soft) 40%, transparent); }
    .row > button:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
    .name { font-weight: 700; min-width: 0; }
    .name small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
    .prog { display: grid; gap: 4px; min-width: 0; }
    .bar { height: 7px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
    .prog small, .num small { color: var(--muted); font-size: .82rem; }
    .num { font-variant-numeric: tabular-nums; }
    .flags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: end; }
    @media (max-width: 760px) {
      .row > button { grid-template-columns: minmax(0, 1fr) auto; }
      .row .prog { grid-column: 1 / -1; order: 3; }
      .row .num { display: none; }
      .flags { order: 2; }
    }

    .detail { padding: 4px 16px 18px; display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .detail h3 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    .detail ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .92rem; }
    .detail li { display: flex; justify-content: space-between; gap: 8px; }
    .detail li span:last-child { font-variant-numeric: tabular-nums; color: var(--soft); white-space: nowrap; }
    .detail .facts li span:first-child { color: var(--muted); }
    @media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
    .empty { color: var(--muted); font-size: .92rem; }
    .note { color: var(--muted); font-size: .85rem; }
    .gate { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 10px; max-width: 34rem; }
    @media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }
  </style>
</head>
<body>
  <main class="wrap" id="app"><p class="empty">Loading the class report…</p></main>
  <script src="content.js"></script>
  <script src="informe.js"></script>
</body>
</html>
